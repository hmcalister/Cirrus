x-common-environment: &common-environment
  # DEBUG: "true"
  POSTGRES_HOST: database-container
  POSTGRES_PORT: 5432
  DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
  DB_MIN_CONNS: ${DB_MIN_CONNS:-1}
  DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-1h}
  DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-30m}
  DB_HEALTH_CHECK_PERIOD: ${DB_HEALTH_CHECK_PERIOD:-1m}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
  EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
  EMAIL_SMTP_TIMEOUT: ${EMAIL_SMTP_TIMEOUT:-30s}

x-server-environment: &server-environment
  <<: *common-environment
  HTTP_ADDR: ${HTTP_ADDR:-:8080}
  HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-30s}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-2m}
  HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
  EMAIL_RATE_LIMIT_ADDRESS_BURST: ${EMAIL_RATE_LIMIT_ADDRESS_BURST:-3}
  EMAIL_RATE_LIMIT_ADDRESS_INTERVAL: ${EMAIL_RATE_LIMIT_ADDRESS_INTERVAL:-15m}
  EMAIL_RATE_LIMIT_GLOBAL_BURST: ${EMAIL_RATE_LIMIT_GLOBAL_BURST:-100}
  EMAIL_RATE_LIMIT_GLOBAL_INTERVAL: ${EMAIL_RATE_LIMIT_GLOBAL_INTERVAL:-10m}
  EMAIL_RATE_LIMIT_SWEEP_CADENCE: ${EMAIL_RATE_LIMIT_SWEEP_CADENCE:-1m}
  AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:8080}
  AUTH_LINK_EXPIRY: ${AUTH_LINK_EXPIRY:-15m}
  AUTH_SESSION_EXPIRY: ${AUTH_SESSION_EXPIRY:-24h}

x-mailer-environment: &mailer-environment
  <<: *common-environment
  # Time of day, in UTC, that the daily email job runs. HH:MM
  DAILY_EMAIL_TIME: ${DAILY_EMAIL_TIME:-08:00}
  # How many recipients share one BCC'd email.
  DAILY_EMAIL_BCC_BATCH_SIZE: ${DAILY_EMAIL_BCC_BATCH_SIZE:-32}
  # The bucket daily cloud images are read from, and deleted from after sending.
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION}
  # Custom endpoint for S3-compatible providers such as DigitalOcean Spaces. Empty uses AWS.
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  app-container:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database-container:
        condition: service_healthy
    env_file:
      - ./.env
    environment: *server-environment
    user: "65532:65532"
    tmpfs:
      - /tmp
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  mailer-container:
    build:
      context: .
    entrypoint: ["/app/mailer"]
    depends_on:
      database-container:
        condition: service_healthy
    env_file:
      - ./.env
    environment: *mailer-environment
    user: "65532:65532"
    tmpfs:
      - /tmp
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped

  database-container:
    image: docker.io/library/postgres:18-alpine
    # For debug purpose only, no need to expose the database in production
    # ports:
    #   - "127.0.0.1:5432:5432"
    expose:
      - "5432"
    env_file:
      - ./.env
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      timeout: 10s
      interval: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./sqlc/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - database-data:/var/lib/postgresql/data
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    shm_size: 128mb

networks:
  app-network:

volumes:
  database-data:
